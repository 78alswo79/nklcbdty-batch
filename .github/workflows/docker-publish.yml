name: Build and Publish Docker Image

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # GitHub Packages 에서 nklcbdty-common 다운로드용

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'  # JDK 버전 설정
          distribution: 'adopt'  # JDK 배포판

      - name: Make gradlew executable
        run: chmod +x ./gradlew  # gradlew에 실행 권한 부여

      # 테스트를 안 돌리던 시절엔 nklcbdty-common 의 수정이 반영 안 된 채(옛 버전 pin)
      # 배포돼도 아무도 몰랐다. 자격증명이 필요한 @SpringBootTest 는 스스로 skip 되므로
      # 여기서 도는 건 DB/네트워크 없이 끝나는 단위 테스트뿐이다.
      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test bootJar
        working-directory: ./  # 루트 디렉토리로 설정

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # CloudType 은 `latest` 를 이미 받아둔 것으로 보고 새 이미지를 pull 하지 않는다.
      # 2026-09-13 기준 운영 컨테이너는 2026-05 빌드였다 — actuator/scheduledtasks 의
      # 링크검증 크론이 `0 30 7 * * *` 였고, 그 값은 b14f6ba~ba45e23 구간 코드에만 있다.
      # 이미지는 8/27 에 올라가 있었으니 태그 이름이 안 바뀐 게 원인이다.
      # 그래서 매 빌드마다 이름이 달라지는 커밋 SHA 태그를 함께 올린다. 처음 보는 태그는
      # 캐시가 없으므로 CloudType 이 반드시 받아온다. `latest` 는 기존 참조용으로 유지.
      - name: Resolve image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GITHUB_ACTOR=${{ github.actor }} \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t ejy1024/nklcbdty-batch:latest \
            -t ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }} .

      - name: Push Docker image
        run: |
          docker push ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }}
          docker push ejy1024/nklcbdty-batch:latest

      # CloudType 콘솔에 넣을 태그를 Actions 요약에 남긴다.
      # 이 태그로 바꿔야 재배포가 실제로 새 코드를 올린다.
      - name: Write deploy hint
        run: |
          {
            echo "### CloudType 에 넣을 이미지 태그"
            echo
            echo '```'
            echo "ejy1024/nklcbdty-batch:${{ steps.tag.outputs.sha }}"
            echo '```'
            echo
            echo "콘솔에서 이미지 태그를 위 값으로 바꾼 뒤 재배포하면 캐시를 우회해 새 코드가 뜬다."
            echo "떠 있는 빌드는 \`/actuator/scheduledtasks\` 의 크론으로 확인할 수 있다."
          } >> "$GITHUB_STEP_SUMMARY"
